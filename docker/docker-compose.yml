version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: glucoai-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./glucoai.db
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - glucoai-data:/glucoai/data
      - glucoai-models:/glucoai/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: glucoai-dashboard
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - glucoai-data:/glucoai/data
      - glucoai-models:/glucoai/app/models
    depends_on:
      api:
        condition: service_healthy

volumes:
  glucoai-data:
  glucoai-models:
